name: CodeQL

# This workflow is the code-scanning analysis source for this repository.
#
# The org `aviation-grade-main-org` ruleset requires a status check named exactly
# `CodeQL`, pinned to integration_id 57789. That context is the code-scanning
# merge-protection check emitted by the `github-advanced-security` app; it is NOT a job
# in this file, and no job here could produce it, because jobs are emitted by GitHub
# Actions under integration_id 15368. What satisfies the context is the EXISTENCE of a
# code-scanning analysis for the head under evaluation.
#
# SCOPE, stated rather than left to be inferred: the matrix analyses `actions` only,
# which is the same scope prism-ios (the conformant Swift sibling in this org) ships.
# CodeQL's `swift` extractor has no `build-mode: none` path and wants a real Xcode
# build, which is a macOS runner and a separate piece of work. So this workflow makes
# code scanning REAL for the workflow surface and leaves the Swift sources unanalysed;
# that residual is deliberate and is tracked, not hidden.
#
# Refs skyphusion-labs/fleet-chezmoi#1612

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CodeQL:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
