name: coverage

# Free GitHub Actions check named `coverage` (org ruleset context).
# Does NOT use actions/upload-code-coverage -- that is paid Code Quality.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: JS/TS coverage
        if: hashFiles('package.json') != ''
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
          if npm run --silent 2>/dev/null | grep -qE '^  coverage'; then
            npm run coverage
          elif npm run --silent 2>/dev/null | grep -qE '^  test'; then
            npm test
          else
            echo "no test/coverage script; coverage check present"
          fi

      - name: Go coverage
        if: hashFiles('go.mod') != ''
        run: |
          set -euo pipefail
          go test ./... -cover

      - name: Setup Swift
        if: hashFiles('Package.swift') != ''
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
        with:
          swift-version: "5.10"

      - name: Swift coverage
        if: hashFiles('Package.swift') != ''
        run: |
          set -euo pipefail
          swift test --enable-code-coverage
          codecov="$(swift test --show-codecov-path)"
          test -s "$codecov"
          echo "line coverage: $(jq -r '.data[0].totals.lines.percent' "$codecov")%"

      - name: Present
        if: hashFiles('package.json') == '' && hashFiles('go.mod') == '' && hashFiles('Package.swift') == ''
        run: echo "no supported test manifest; coverage check present"
