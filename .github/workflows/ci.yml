name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: kit
    # Swiftly 1.1.0, which setup-swift v3 uses, rejects ubuntu-26.04
    # ("Unsupported Linux platform"). 24.04 is the release Swift 5.10 installs on.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # setup-swift v3 verifies the Swiftly download with Swift Automatic
      # Signing Key #4 (E813 C892 820A 6FA1 3755 B268 F167 DF1A CF9C E069).
      # That key is not on the runner image, so gpg exits 2. Import the keys
      # published at swift.org before the action runs gpg --verify.
      - name: Import Swift signing keys
        run: |
          set -euo pipefail
          # swift.org 302s to www.swift.org. A runner that receives the HTML
          # redirect body instead of the key makes gpg exit 2 and the kit job
          # never reaches swift test. Fetch the key URL directly and refuse
          # anything that is not a key block.
          curl --show-error --retry 5 --retry-all-errors --fail --location \
            --output "$RUNNER_TEMP/swift-keys.asc" \
            https://www.swift.org/keys/all-keys.asc
          grep -q 'BEGIN PGP PUBLIC KEY BLOCK' "$RUNNER_TEMP/swift-keys.asc"
          gpg --import "$RUNNER_TEMP/swift-keys.asc"
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: "5.10"
      - name: Build + test VivijureKit
        run: swift test --package-path .
        env:
          DEVELOPER_DIR: ${{ runner.os == 'macOS' && '/Applications/Xcode.app/Contents/Developer' || '' }}

  # Builds the `Vivijure` app target (`App/` SwiftUI shell). `kit` only runs `swift test` on
  # the package, so before this job an `App/` change could break the app with every check
  # green (issue #26). Unsigned generic-iOS build: no simulator boot, no signing identity.
  # macOS minutes bill at a higher rate than Linux; accepted for a correctness gate.
  # NOT path-filtered on purpose: it feeds the `ci` aggregate below, and a skipped
  # component would fail that aggregate (and a skipped required check reads as passed).
  app:
    name: app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build Vivijure app target
        run: |
          set -o pipefail
          xcodebuild -project Vivijure.xcodeproj -scheme Vivijure \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build

  # `ci` is a REQUIRED status check in the org `aviation-grade-main-org` ruleset and is
  # matched by STRING against the check-run name, which is a job's `name:`. It matches
  # neither the workflow filename nor this workflow's own `name:` field, so a workflow
  # called `ci` whose only job is `kit` does not produce a check named `ci`.
  #
  # This aggregate job supplies that name while keeping `kit` separately visible.
  # `if: ${{ !cancelled() }}` plus an explicit `test` per component is load-bearing:
  # a `needs:`-only job SKIPS when a component fails, and a skipped job still produces
  # a check run whose conclusion SATISFIES a required context, so the aggregate would
  # go green on exactly the failure it exists to report. Canonical shape:
  # postern/.github/workflows/ci.yml, and fleet-chezmoi
  # docs/runbooks/aviation-grade-main.md section 4.
  ci:
    name: ci
    needs: [kit, app]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all component jobs
        run: |
          test "${{ needs.kit.result }}" = "success"
          test "${{ needs.app.result }}" = "success"
